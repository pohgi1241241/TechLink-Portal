<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Student-friendly ICT learning guides for hardware, software, USB, networking, and troubleshooting.">
<title>ICT Learning Portal | St. Ignatius Technical Institute</title>
<style>
  :root {
    color-scheme: light;
    --primary: #1e3a5f;
    --accent: #2563eb;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --line: #e2e8f0;
    --success: #16a34a;
    --error: #dc2626;
    --font-size: 16px;
  }

  body.dark {
    color-scheme: dark;
    --primary: #1e293b;
    --accent: #60a5fa;
    --bg: #0f172a;
    --card: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --line: #334155;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    font-size: var(--font-size);
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
  }

  a { color: var(--accent); }
  button, input { font: inherit; }
  button { cursor: pointer; }

  button:focus-visible, a:focus-visible, input:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  header {
    background: var(--card);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .brand h1 { margin: 0; font-size: 1.15rem; color: var(--primary); }
  body.dark .brand h1 { color: var(--text); }
  .brand p { margin: 0; font-size: .85rem; color: var(--muted); }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  button {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 14px;
    background: var(--card);
    color: var(--text);
    transition: background .15s, border-color .15s;
  }

  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { cursor: not-allowed; opacity: .55; }

  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  button.primary:hover:not(:disabled) { color: #fff; opacity: .92; }

  .layout {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px;
    display: grid;
    grid-template-columns: 240px minmax(0, 1fr);
    gap: 24px;
  }

  aside { position: sticky; top: 90px; height: fit-content; }

  .search {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    margin-bottom: 14px;
  }

  .nav-label {
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    margin: 14px 0 6px;
  }

  .nav-btn {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    background: transparent;
    padding: 8px 10px;
    border-radius: 6px;
    margin-bottom: 2px;
    color: var(--text);
  }

  .nav-btn:hover { background: var(--line); color: var(--text); }
  .nav-btn.active { background: var(--accent); color: #fff; }
  .nav-btn .tick { color: var(--success); margin-right: 4px; font-weight: 700; }
  .nav-btn.active .tick { color: #fff; }

  .progress { margin-top: 20px; font-size: .85rem; color: var(--muted); }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .bar div { height: 100%; width: 0; background: var(--success); transition: width .3s; }

  main {
    min-width: 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 32px 36px;
    min-height: 520px;
  }

  main h2 { color: var(--primary); margin: 0 0 4px; font-size: 1.6rem; }
  body.dark main h2 { color: var(--text); }
  main h3 { color: var(--accent); margin: 28px 0 10px; font-size: 1.1rem; }
  .meta { color: var(--muted); font-size: .9rem; margin-bottom: 18px; }
  p { margin: 0 0 12px; }

  .toc {
    background: var(--bg);
    border-radius: 10px;
    padding: 14px 18px;
    margin: 18px 0 24px;
  }

  .toc strong {
    font-size: .85rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
  }

  .toc a { display: block; text-decoration: none; padding: 3px 0; font-size: .95rem; }
  .toc a:hover { text-decoration: underline; }

  .hero { padding: 8px 0 4px; }

  .hero-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
    margin-top: 20px;
  }

  .tile {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    cursor: pointer;
    background: var(--card);
    transition: transform .15s, box-shadow .15s;
  }

  .tile:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(15,23,42,.08); }
  .tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .tile .tag { display: inline-block; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin-bottom: 6px; }
  .tile h3 { margin: 0 0 6px; color: var(--text); font-size: 1.02rem; }
  .tile p { margin: 0; color: var(--muted); font-size: .9rem; }

  .grid-3 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin: 14px 0;
  }

  .mini { background: var(--bg); border-radius: 10px; padding: 14px; }
  .mini h4 { margin: 0 0 4px; font-size: .95rem; }
  .mini p { margin: 0; font-size: .88rem; color: var(--muted); }

  table { width: 100%; border-collapse: collapse; margin: 10px 0 16px; font-size: .95rem; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; }

  .steps-box { background: var(--bg); border-radius: 12px; padding: 16px 18px; margin: 12px 0; }
  .step { display: none; min-height: 3.2em; }
  .step.show { display: block; }
  .step-count { font-size: .85rem; color: var(--muted); }
  .progress-steps { height: 4px; background: var(--line); border-radius: 2px; margin: 10px 0 12px; overflow: hidden; }
  .progress-steps div { height: 100%; background: var(--accent); width: 0; transition: width .25s; }
  .step-buttons { display: flex; gap: 8px; margin-top: 8px; }

  .accordion { border-top: 1px solid var(--line); }
  .acc-item { border-bottom: 1px solid var(--line); }
  .acc-head {
    width: 100%;
    text-align: left;
    border: none;
    background: transparent;
    padding: 14px 4px;
    font-weight: 600;
    color: var(--text);
    border-radius: 0;
    display: flex;
    justify-content: space-between;
  }

  .acc-head:hover { color: var(--accent); background: transparent; border: none; }
  .acc-head::after { content: "+"; color: var(--muted); }
  .acc-head[aria-expanded="true"]::after { content: "−"; }
  .acc-body { display: none; padding: 0 4px 14px; color: var(--muted); }
  .acc-body.open { display: block; }

  .callout {
    border-left: 3px solid var(--accent);
    background: var(--bg);
    padding: 12px 16px;
    border-radius: 0 8px 8px 0;
    margin: 14px 0;
    font-size: .95rem;
  }

  .callout.warn { border-color: #f59e0b; }

  .diagram {
    font-family: Consolas, "Courier New", monospace;
    background: var(--bg);
    padding: 14px 16px;
    border-radius: 10px;
    overflow-x: auto;
    font-size: .92rem;
    line-height: 1.8;
  }

  .quiz { border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-top: 24px; }
  .quiz h3 { margin-top: 0; }
  .quiz label { display: block; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .quiz label:hover { background: var(--bg); }
  .quiz input { margin-right: 8px; }
  .quiz-feedback { margin-top: 10px; font-weight: 600; min-height: 1.4em; }
  .ok { color: var(--success); }
  .bad { color: var(--error); }

  .review {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 28px 0 0;
    padding: 14px 16px;
    background: var(--bg);
    border-radius: 10px;
    font-weight: 600;
  }

  .review input { width: 18px; height: 18px; accent-color: var(--success); }

  .sources { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); }
  .sources h3 { margin-top: 0; }
  .sources ul { padding-left: 18px; margin: 0; }
  .sources li { margin-bottom: 10px; }
  .sources a { text-decoration: none; }
  .sources a:hover { text-decoration: underline; }
  .sources span { color: var(--muted); font-size: .88rem; }

  .search-hit { padding: 14px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .search-hit:hover h3 { color: var(--accent); }
  .search-hit h3 { margin: 0 0 4px; color: var(--text); font-size: 1rem; }
  .search-hit p { margin: 0; color: var(--muted); font-size: .9rem; }

  footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 24px 16px 32px; }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; padding: 16px; }
    aside { position: static; }
    main { padding: 22px; }
  }

  @media (max-width: 480px) {
    .header-inner { padding: 12px 16px; }
    .tools button { padding: 6px 10px; }
    main { padding: 18px; }
    table { display: block; overflow-x: auto; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <h1>ICT Learning Portal</h1>
      <p>St. Ignatius Technical Institute, Banay Banay &middot; Senior High School</p>
    </div>
    <div class="tools" aria-label="Display settings">
      <button id="fontDown" type="button" title="Smaller text" aria-label="Decrease text size">A-</button>
      <button id="fontUp" type="button" title="Larger text" aria-label="Increase text size">A+</button>
      <button id="themeToggle" type="button">Dark mode</button>
      <button class="primary" id="homeBtn" type="button">Home</button>
    </div>
  </div>
</header>

<div class="layout">
  <aside aria-label="Topic navigation">
    <label class="nav-label" for="searchBox">Search topics</label>
    <input class="search" id="searchBox" type="search" placeholder="Try USB or networking" autocomplete="off">
    <div class="nav-label">Topics</div>
    <nav id="navList" aria-label="Learning topics"></nav>
    <div class="progress">
      Reviewed <span id="progressText">0 / 0</span>
      <div class="bar" role="progressbar" aria-label="Topics reviewed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progressBar"></div>
      </div>
    </div>
  </aside>

  <main id="content" tabindex="-1" aria-live="polite"></main>
</div>

<footer>
  This portal supplements, and does not replace, teachers, classroom activities, or hands-on practice.
</footer>

<script>
"use strict";

/* ================= CONTENT ================= */
const articles = {
  troubleshooting: {
    title: "Troubleshooting",
    category: "IT Support",
    summary: "A structured method for finding and fixing computer and device problems.",
    html: `
      <p>Troubleshooting is a structured process for finding the cause of a problem and fixing it. Good technicians avoid random changes: they gather evidence, test one likely cause at a time, and record the result.</p>

      <h3>The general troubleshooting method</h3>
      <div class="steps-box" data-steps='[
        "Identify the problem: ask what happened, when it started, and what changed recently.",
        "Gather information: check error messages, indicator lights, sounds, and relevant system logs.",
        "Establish a probable cause: start with simple explanations such as a loose cable, muted audio, or no power.",
        "Test the theory: change one thing at a time and observe whether the symptom changes.",
        "Plan and apply the fix: use an approved setting, update, repair, or replacement.",
        "Verify normal operation and check that other important functions still work.",
        "Document the symptom, cause, fix, and any follow-up needed."
      ]'></div>

      <h3>Common symptoms and first checks</h3>
      <table>
        <thead><tr><th>Symptom</th><th>First checks</th><th>Possible cause</th></tr></thead>
        <tbody>
          <tr><td>Computer will not turn on</td><td>Power cable, outlet, battery, and power indicator</td><td>No power or a hardware fault</td></tr>
          <tr><td>No internet</td><td>Wi-Fi status, Ethernet cable, and whether other devices connect</td><td>Connection, router, or service issue</td></tr>
          <tr><td>Device is not recognized</td><td>Try a known-good cable or port; check Device Manager</td><td>Faulty cable, port, device, or driver</td></tr>
          <tr><td>Computer is slow</td><td>Check available storage and Task Manager resource use</td><td>High resource use, low storage, or unwanted software</td></tr>
        </tbody>
      </table>

      <div class="callout warn">Back up important files before major repairs or changes. Do not open power supplies or other equipment that may expose dangerous voltages.</div>

      <div class="quiz" data-question="What should you do first when troubleshooting?"
        data-options='["Replace the hard disk","Identify the problem","Reinstall the operating system"]'
        data-answer="1"></div>
    `,
    sources: [
      ["Microsoft Support: Troubleshoot problems in Windows", "https://support.microsoft.com/windows", "Microsoft support articles for diagnosing common Windows problems."],
      ["Google IT Support Certificate", "https://grow.google/certificates/it-support/", "IT support training that includes troubleshooting and customer support."],
      ["CompTIA A+ Certification", "https://www.comptia.org/certifications/a", "Overview of an IT support certification that covers troubleshooting concepts."]
    ]
  },

  identification: {
    title: "Hardware and Software Identification",
    category: "Hardware & Software",
    summary: "Recognize computer components and find installed system and software details.",
    html: `
      <p><strong>Hardware</strong> is the physical equipment in a computer system. <strong>Software</strong> is the programs and instructions that run on it. Identifying both helps technicians describe a problem and choose the right support steps.</p>

      <h3>Core hardware components</h3>
      <div class="grid-3">
        <div class="mini"><h4>CPU</h4><p>Executes program instructions. Its model and speed can be checked in system information.</p></div>
        <div class="mini"><h4>RAM</h4><p>Temporary working memory used by running programs. Capacity is commonly measured in GB.</p></div>
        <div class="mini"><h4>Storage</h4><p>An HDD or SSD keeps files and programs when the computer is turned off.</p></div>
        <div class="mini"><h4>Motherboard</h4><p>The main circuit board that connects the processor, memory, storage, and other components.</p></div>
        <div class="mini"><h4>GPU</h4><p>Processes graphics and sends video output to a display.</p></div>
        <div class="mini"><h4>PSU</h4><p>Provides a computer's internal components with the electrical power they require.</p></div>
      </div>

      <h3>Checking system information on Windows</h3>
      <div class="steps-box" data-steps='[
        "Press Windows + R, type msinfo32, and press Enter to open System Information.",
        "Look for the Windows version, processor, installed memory, and system model.",
        "Right-click Start and open Device Manager to see detected hardware and driver status.",
        "Open Settings and select Apps to view installed software. Menu names can vary by Windows version."
      ]'></div>

      <h3>Hardware or software?</h3>
      <div class="accordion">
        <div class="acc-item">
          <button class="acc-head" type="button" aria-expanded="false">A keyboard</button>
          <div class="acc-body">The keyboard is hardware. A device driver that helps the operating system communicate with it is software.</div>
        </div>
        <div class="acc-item">
          <button class="acc-head" type="button" aria-expanded="false">A web browser</button>
          <div class="acc-body">A web browser is software. The computer and display it runs on are hardware.</div>
        </div>
        <div class="acc-item">
          <button class="acc-head" type="button" aria-expanded="false">Windows</button>
          <div class="acc-body">Windows is system software: an operating system that manages hardware and provides a platform for applications.</div>
        </div>
      </div>

      <div class="quiz" data-question="Which of the following is software?"
        data-options='["Hard disk drive","Device driver","RAM module"]'
        data-answer="1"></div>
    `,
    sources: [
      ["Microsoft Support: Find operating system information", "https://support.microsoft.com/windows", "Windows support resources for system settings and diagnostics."],
      ["Khan Academy: Computers and the Internet", "https://www.khanacademy.org/computing/computers-and-internet", "Introductory lessons on computer systems and how they work."],
      ["Intel: Learn about processors", "https://www.intel.com/content/www/us/en/products/details/processors.html", "Processor information and product details from a CPU manufacturer."]
    ]
  },

  usb: {
    title: "USB Identification and Safety",
    category: "Hardware & Software",
    summary: "Recognize common USB connectors, understand speed labels, and troubleshoot devices.",
    html: `
      <p>Universal Serial Bus (USB) is used to connect devices such as flash drives, keyboards, phones, and printers. The connector shape, supported USB standard, cable, and connected devices all affect what a connection can do.</p>

      <h3>Common connector types</h3>
      <table>
        <thead><tr><th>Connector</th><th>Shape</th><th>Common uses</th></tr></thead>
        <tbody>
          <tr><td>USB Type-A</td><td>Flat rectangle; inserts one way</td><td>Computers, flash drives, keyboards</td></tr>
          <tr><td>USB Type-B</td><td>Usually squarish with beveled corners</td><td>Some printers and equipment</td></tr>
          <tr><td>Micro-USB</td><td>Small, flat connector; inserts one way</td><td>Older phones and small devices</td></tr>
          <tr><td>USB Type-C</td><td>Small oval; reversible</td><td>Many modern phones, laptops, and accessories</td></tr>
        </tbody>
      </table>

      <h3>USB versions and practical speed</h3>
      <p>USB names and specifications have changed over time. For example, USB 2.0 has a signaling rate of up to 480 Mbps, while USB 3.2 Gen 1 is rated up to 5 Gbps. These are theoretical rates—not a promise of actual file-transfer speed. The port, device, cable, and workload all matter.</p>
      <div class="callout">Connector shape does not tell you every capability. A USB Type-C port or cable may support different data speeds, charging power, or video features. Check the device and cable specifications.</div>

      <h3>Checking a USB device</h3>
      <div class="steps-box" data-steps='[
        "Check that the connector fits without force. Never force a plug into a port.",
        "Try a different compatible port and, if available, a known-good data cable.",
        "On Windows, open Device Manager and look for the device or a warning icon.",
        "Check the manufacturer or operating system support guidance before installing a driver.",
        "Use the operating system’s safe-eject option before removing storage when possible."
      ]'></div>

      <div class="quiz" data-question="Which USB connector is designed to be inserted either way up?"
        data-options='["USB Type-A","USB Type-C","USB Type-B"]'
        data-answer="1"></div>
    `,
    sources: [
      ["USB Implementers Forum", "https://www.usb.org/", "The organization responsible for USB specifications and related resources."],
      ["USB-IF: USB specifications", "https://www.usb.org/documents", "Documents and specification resources published by USB-IF."],
      ["Microsoft Support: USB help", "https://support.microsoft.com/windows", "Windows support resources for USB and connected-device issues."]
    ]
  },

  networking: {
    title: "Networking, Ethernet and RJ45",
    category: "Networking",
    summary: "Learn network basics, IP addressing, Wi-Fi, Ethernet cabling, RJ45 wiring, and safe troubleshooting.",
    html: `
      <p>A computer network is a group of connected devices that communicate and share resources. Networks use wired or wireless links, addressing, and agreed rules called protocols. A home or school network may include computers, phones, printers, switches, wireless access points, and a router.</p>

      <h3>Common network devices</h3>
      <div class="grid-3">
        <div class="mini"><h4>Router</h4><p>Forwards traffic between networks, such as a local network and an internet connection.</p></div>
        <div class="mini"><h4>Switch</h4><p>Connects wired devices on a local network and forwards traffic to the appropriate port.</p></div>
        <div class="mini"><h4>Access point</h4><p>Provides Wi-Fi access to a wired local network.</p></div>
        <div class="mini"><h4>Modem or ONT</h4><p>Connects a home or organization to the service provider’s network; the equipment depends on the connection type.</p></div>
        <div class="mini"><h4>NIC</h4><p>A network interface connects a device to Ethernet, Wi-Fi, or another network type.</p></div>
        <div class="mini"><h4>Firewall</h4><p>Applies rules to network traffic to help protect devices and networks.</p></div>
      </div>

      <h3>IP addresses, gateway, DHCP and DNS</h3>
      <p>An IP address identifies a network interface so it can communicate on an IP network. An IPv4 address is written as four numbers from 0 to 255, for example <strong>192.168.1.10</strong>. Private IPv4 ranges are commonly used inside homes, schools, and organizations; they are not the same as a public internet address.</p>
      <div class="grid-3">
        <div class="mini"><h4>Subnet mask</h4><p>Helps a device determine which IP addresses are on its local network.</p></div>
        <div class="mini"><h4>Default gateway</h4><p>The router or other device a computer uses to reach networks outside its local network.</p></div>
        <div class="mini"><h4>DHCP</h4><p>Automatically supplies network settings, such as an IP address, to devices.</p></div>
        <div class="mini"><h4>DNS</h4><p>Looks up domain names, such as example.com, so applications can find network services.</p></div>
      </div>

      <h3>Ethernet cables and RJ45-style connectors</h3>
      <p>Wired Ethernet commonly uses twisted-pair cables terminated with an 8-position modular connector often called RJ45. The order of the eight conductors must follow a wiring standard at each end. T568A and T568B are the two common termination schemes.</p>

      <h4>T568A and T568B pin order</h4>
      <table>
        <thead><tr><th>Pin</th><th>T568A wire color</th><th>T568B wire color</th></tr></thead>
        <tbody>
          <tr><td>1</td><td>White/Green</td><td>White/Orange</td></tr>
          <tr><td>2</td><td>Green</td><td>Orange</td></tr>
          <tr><td>3</td><td>White/Orange</td><td>White/Green</td></tr>
          <tr><td>4</td><td>Blue</td><td>Blue</td></tr>
          <tr><td>5</td><td>White/Blue</td><td>White/Blue</td></tr>
          <tr><td>6</td><td>Orange</td><td>Green</td></tr>
          <tr><td>7</td><td>White/Brown</td><td>White/Brown</td></tr>
          <tr><td>8</td><td>Brown</td><td>Brown</td></tr>
        </tbody>
      </table>

      <p>For a typical patch cable, use the same wiring standard at both ends. T568A on one end and T568B on the other makes a crossover cable. Many modern network ports support Auto MDI-X, so a crossover cable is often unnecessary; follow your equipment or lab instructions.</p>

      <h3>Making and testing a patch cable</h3>
      <div class="steps-box" data-steps='[
        "Use the cable type, connector, tools, and wiring standard specified by your teacher or equipment manufacturer.",
        "Cut the cable to the required length and carefully remove a small amount of the outer jacket without damaging the inner wires.",
        "Arrange all eight conductors in the chosen T568A or T568B order. Keep the pairs twisted as close to the connector as the plug design allows.",
        "Trim the conductors evenly and insert them fully into a compatible connector, checking that the jacket is positioned for strain relief.",
        "Use the correct crimping tool, then inspect the connector for correct order and fully seated contacts.",
        "Test the finished cable with an Ethernet cable tester and correct any failed connections before use."
      ]'></div>

      <div class="callout warn">Copper Ethernet channels are commonly designed for a maximum of 100 m overall, including the permanent cable and patch leads. Use suitable cable, connectors, and installation practices for the environment. Avoid running network cable where it can be crushed, overheated, or create a trip hazard.</div>

      <h3>Wi-Fi basics and safety</h3>
      <p>Wi-Fi connects devices to a local network using radio signals. Signal strength can be affected by distance, walls, interference, and access-point placement. Use the school’s approved network, follow its access rules, and do not share passwords or attempt to change network equipment without permission.</p>

      <h3>Useful Windows network tools</h3>
      <div class="accordion">
        <div class="acc-item">
          <button class="acc-head" type="button" aria-expanded="false">ipconfig</button>
          <div class="acc-body">Displays local IP configuration, including the address, subnet mask, and default gateway. Use it to check whether the device received network settings.</div>
        </div>
        <div class="acc-item">
          <button class="acc-head" type="button" aria-expanded="false">ping</button>
          <div class="acc-body">Checks whether a destination responds to network test messages. A missing reply does not always mean the destination is offline; some networks block these messages. Only test devices or addresses you are authorized to check.</div>
        </div>
        <div class="acc-item">
          <button class="acc-head" type="button" aria-expanded="false">nslookup</button>
          <div class="acc-body">Queries DNS to see whether a domain name can be resolved to an address. Results depend on the DNS server and network configuration.</div>
        </div>
        <div class="acc-item">
          <button class="acc-head" type="button" aria-expanded="false">tracert</button>
          <div class="acc-body">Shows the route toward a destination, one network hop at a time. Some routers do not respond to these probes, so a timeout alone does not prove a fault.</div>
        </div>
      </div>

      <h3>A safe first-check sequence</h3>
      <div class="steps-box" data-steps='[
        "Check whether the issue affects one device or several devices.",
        "Check Wi-Fi status or Ethernet cable connections, and look for link lights if present.",
        "Check the device’s network settings and see whether it has an IP address and default gateway.",
        "If permitted, ask your teacher or network administrator whether there is a known outage or maintenance.",
        "Record the error message and what you checked. Share it with the responsible support person."
      ]'></div>

      <div class="callout">Use network commands only on your own device or a lab network where you have permission. Do not scan, access, or change school or public network devices without explicit authorization.</div>

      <div class="quiz" data-question="Which device commonly forwards traffic between a local network and other networks?"
        data-options='["Router","Keyboard","Monitor"]'
        data-answer="0"></div>
    `,
    sources: [
      ["Cisco Networking Academy", "https://www.netacad.com/", "Networking courses and learning resources for students."],
      ["Cisco: What is a computer network?", "https://www.cisco.com/site/us/en/learn/topics/networking/what-is-a-computer-network.html", "An overview of networks, devices, and network communication."],
      ["Microsoft Learn: Windows networking", "https://learn.microsoft.com/en-us/windows-server/networking/", "Microsoft documentation for Windows networking concepts and tools."],
      ["Cloudflare Learning Center: DNS", "https://www.cloudflare.com/learning/dns/what-is-dns/", "An accessible explanation of domain name resolution."],
      ["IEEE 802.3 Ethernet Working Group", "https://www.ieee802.org/3/", "Information about the IEEE Ethernet standards working group."],
      ["Fluke Networks: Knowledge base", "https://www.flukenetworks.com/knowledge-base", "Networking and cable-testing learning resources."],
      ["TIA: Standards", "https://www.tiaonline.org/what-we-do/standards/", "Telecommunications industry standards information."]
    ]
  }
};

/* ================= ELEMENTS & STATE ================= */
const content = document.getElementById("content");
const navList = document.getElementById("navList");
const searchBox = document.getElementById("searchBox");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");
const progressTrack = document.querySelector(".bar");
const themeBtn = document.getElementById("themeToggle");

function readStoredJSON(key, fallback) {
  try {
    const value = JSON.parse(localStorage.getItem(key));
    return value === null ? fallback : value;
  } catch {
    return fallback;
  }
}

const articleKeys = Object.keys(articles);
const storedReviewed = readStoredJSON("ictReviewed", []);
let reviewed = Array.isArray(storedReviewed)
  ? storedReviewed.filter(key => articleKeys.includes(key))
  : [];

let currentKey = null;

function readFontSize() {
  try {
    const size = Number.parseInt(localStorage.getItem("ictFont") || "16", 10);
    return Number.isFinite(size) ? Math.min(22, Math.max(12, size)) : 16;
  } catch {
    return 16;
  }
}

let fontSize = readFontSize();

/* ================= UTILITIES ================= */
function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function saveReviewed() {
  try {
    localStorage.setItem("ictReviewed", JSON.stringify(reviewed));
  } catch {
    // The portal remains usable when browser storage is unavailable.
  }
}

function updateProgress() {
  const total = articleKeys.length;
  const percent = total ? Math.round(reviewed.length / total * 100) : 0;
  progressText.textContent = `${reviewed.length} / ${total}`;
  progressBar.style.width = `${percent}%`;
  progressTrack.setAttribute("aria-valuenow", String(percent));
}

function buildNav(filter = "") {
  navList.replaceChildren();
  const normalized = filter.toLowerCase();

  articleKeys.forEach(key => {
    const article = articles[key];
    if (normalized && !(article.title + " " + article.category).toLowerCase().includes(normalized)) return;

    const button = document.createElement("button");
    button.type = "button";
    button.className = "nav-btn" + (key === currentKey ? " active" : "");
    button.setAttribute("aria-current", key === currentKey ? "page" : "false");

    const title = document.createElement("span");
    title.textContent = article.title;

    if (reviewed.includes(key)) {
      const tick = document.createElement("span");
      tick.className = "tick";
      tick.setAttribute("aria-label", "Reviewed");
      tick.textContent = "✓ ";
      button.append(tick);
    }

    button.append(title);
    button.addEventListener("click", () => showArticle(key));
    navList.append(button);
  });

  updateProgress();
}

/* ================= HOME ================= */
function showHome() {
  currentKey = null;

  const tiles = articleKeys.map(key => `
    <article class="tile" data-key="${key}" tabindex="0" role="button"
      aria-label="Open ${escapeHtml(articles[key].title)}">
      <span class="tag">${escapeHtml(articles[key].category)}</span>
      <h3>${escapeHtml(articles[key].title)}</h3>
      <p>${escapeHtml(articles[key].summary)}</p>
    </article>
  `).join("");

  content.innerHTML = `
    <div class="hero">
      <h2>ICT Learning Portal</h2>
      <p>Guides, explanations, and troubleshooting references for selected ICT topics. Choose a topic below or use search. Mark a topic as reviewed when you finish it.</p>
      <p>This portal is an extra resource. Continue following your teacher’s instructions, classroom activities, and hands-on practice.</p>
    </div>
    <div class="hero-grid">${tiles}</div>`;

  content.querySelectorAll(".tile").forEach(tile => {
    const openTile = () => showArticle(tile.dataset.key);
    tile.addEventListener("click", openTile);
    tile.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openTile();
      }
    });
  });

  buildNav();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ================= ARTICLE ================= */
function showArticle(key) {
  const article = articles[key];
  if (!article) return;

  currentKey = key;
  const isReviewed = reviewed.includes(key);
  const sourcesHtml = article.sources.map(source => `
    <li>
      <a href="${escapeHtml(source[1])}" target="_blank" rel="noopener noreferrer">${escapeHtml(source[0])}</a><br>
      <span>${escapeHtml(source[2])}</span>
    </li>
  `).join("");

  content.innerHTML = `
    <h2>${escapeHtml(article.title)}</h2>
    <div class="meta">${escapeHtml(article.category)}</div>
    <nav class="toc" id="toc" aria-label="On this page"><strong>On this page</strong></nav>
    <div id="articleBody">${article.html}</div>
    <label class="review">
      <input type="checkbox" id="reviewedBox" ${isReviewed ? "checked" : ""}>
      I have reviewed this topic
    </label>
    <section class="sources" aria-labelledby="sourcesHeading">
      <h3 id="sourcesHeading">Sources and further reading</h3>
      <ul>${sourcesHtml}</ul>
    </section>`;

  buildTOC();
  initInteractive();
  buildNav(searchBox.value.trim());

  document.getElementById("reviewedBox").addEventListener("change", event => {
    if (event.target.checked && !reviewed.includes(key)) reviewed.push(key);
    if (!event.target.checked) reviewed = reviewed.filter(item => item !== key);
    saveReviewed();
    buildNav(searchBox.value.trim());
  });

  window.scrollTo({ top: 0, behavior: "smooth" });
  content.focus({ preventScroll: true });
}

function buildTOC() {
  const toc = document.getElementById("toc");
  const headings = document.querySelectorAll("#articleBody h3");

  if (!headings.length) {
    toc.remove();
    return;
  }

  headings.forEach((heading, index) => {
    const id = `section-${index}`;
    heading.id = id;

    const link = document.createElement("a");
    link.href = `#${id}`;
    link.textContent = heading.textContent;
    toc.append(link);
  });
}

/* ================= INTERACTIVE COMPONENTS ================= */
function initInteractive() {
  // Step-by-step guides
  document.querySelectorAll(".steps-box[data-steps]").forEach(box => {
    let steps;

    try {
      steps = JSON.parse(box.dataset.steps);
    } catch {
      box.textContent = "This guide could not be loaded.";
      return;
    }

    if (!Array.isArray(steps) || steps.length === 0) {
      box.textContent = "No steps are available.";
      return;
    }

    let current = 0;
    const wrap = document.createElement("section");
    wrap.className = "steps-box";
    wrap.setAttribute("aria-label", "Step-by-step guide");
    wrap.innerHTML = `
      <div class="step-count" aria-live="polite"></div>
      <div class="progress-steps" aria-hidden="true"><div></div></div>
      ${steps.map((step, index) => `<div class="step${index === 0 ? " show" : ""}">${escapeHtml(step)}</div>`).join("")}
      <div class="step-buttons">
        <button type="button" class="prev">Previous</button>
        <button type="button" class="primary next">Next</button>
      </div>`;

    box.replaceWith(wrap);

    const shown = wrap.querySelectorAll(".step");
    const count = wrap.querySelector(".step-count");
    const fill = wrap.querySelector(".progress-steps div");
    const prev = wrap.querySelector(".prev");
    const next = wrap.querySelector(".next");

    function update() {
      shown.forEach((step, index) => step.classList.toggle("show", index === current));
      count.textContent = `Step ${current + 1} of ${steps.length}`;
      fill.style.width = `${((current + 1) / steps.length) * 100}%`;
      prev.disabled = current === 0;
      next.textContent = current === steps.length - 1 ? "Finish" : "Next";
    }

    prev.addEventListener("click", () => {
      if (current > 0) {
        current--;
        update();
      }
    });

    next.addEventListener("click", () => {
      if (current < steps.length - 1) {
        current++;
        update();
      } else {
        count.textContent = "All steps complete";
        next.disabled = true;
      }
    });

    update();
  });

  // Accordions
  document.querySelectorAll(".acc-head").forEach(button => {
    button.addEventListener("click", () => {
      const isOpen = button.getAttribute("aria-expanded") === "true";
      button.setAttribute("aria-expanded", String(!isOpen));
      button.nextElementSibling.classList.toggle("open", !isOpen);
    });
  });

  // Quizzes
  document.querySelectorAll(".quiz").forEach((quiz, index) => {
    let options;

    try {
      options = JSON.parse(quiz.dataset.options);
    } catch {
      quiz.textContent = "This quiz could not be loaded.";
      return;
    }

    const answer = Number.parseInt(quiz.dataset.answer, 10);
    const name = `quiz-${currentKey}-${index}`;

    quiz.innerHTML = `
      <h3>Quick check</h3>
      <p>${escapeHtml(quiz.dataset.question)}</p>
      ${options.map((option, optionIndex) => `
        <label><input type="radio" name="${name}" value="${optionIndex}">${escapeHtml(option)}</label>
      `).join("")}
      <button type="button" class="primary check" style="margin-top:8px">Check answer</button>
      <div class="quiz-feedback" aria-live="polite"></div>`;

    const feedback = quiz.querySelector(".quiz-feedback");

    quiz.querySelector(".check").addEventListener("click", () => {
      const chosen = quiz.querySelector("input:checked");

      if (!chosen) {
        feedback.className = "quiz-feedback bad";
        feedback.textContent = "Select an option first.";
        return;
      }

      if (Number.parseInt(chosen.value, 10) === answer) {
        feedback.className = "quiz-feedback ok";
        feedback.textContent = "Correct.";
      } else {
        feedback.className = "quiz-feedback bad";
        feedback.textContent = "Not quite. Review the section and try again.";
      }
    });
  });
}

/* ================= SEARCH ================= */
function showSearchResults(rawQuery) {
  const query = rawQuery.toLowerCase();

  const hits = articleKeys.filter(key => {
    const article = articles[key];
    const text = `${article.title} ${article.category} ${article.summary} ${article.html.replace(/<[^>]+>/g, " ")}`;
    return text.toLowerCase().includes(query);
  });

  content.innerHTML = `
    <h2>Results for “${escapeHtml(rawQuery)}”</h2>
    <div style="margin-top:16px">
      ${hits.length ? hits.map(key => `
        <article class="search-hit" data-key="${key}" tabindex="0" role="button"
          aria-label="Open ${escapeHtml(articles[key].title)}">
          <h3>${escapeHtml(articles[key].title)}</h3>
          <p>${escapeHtml(articles[key].summary)}</p>
        </article>
      `).join("") : "<p>No topics match. Try words like USB, RJ45, troubleshooting, or network.</p>"}
    </div>`;

  content.querySelectorAll(".search-hit").forEach(hit => {
    const openHit = () => showArticle(hit.dataset.key);
    hit.addEventListener("click", openHit);
    hit.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openHit();
      }
    });
  });

  content.focus({ preventScroll: true });
}

searchBox.addEventListener("input", event => {
  const rawQuery = event.target.value.trim();
  buildNav(rawQuery);

  if (!rawQuery) {
    showHome();
    return;
  }

  showSearchResults(rawQuery);
});

/* ================= THEME, FONT, HOME ================= */
function applyFont() {
  document.documentElement.style.setProperty("--font-size", `${fontSize}px`);
  try {
    localStorage.setItem("ictFont", String(fontSize));
  } catch {
    // Keep the selected size for the current page even if storage is unavailable.
  }
}

document.getElementById("fontUp").addEventListener("click", () => {
  if (fontSize < 22) {
    fontSize++;
    applyFont();
  }
});

document.getElementById("fontDown").addEventListener("click", () => {
  if (fontSize > 12) {
    fontSize--;
    applyFont();
  }
});

function setTheme(isDark) {
  document.body.classList.toggle("dark", isDark);
  themeBtn.textContent = isDark ? "Light mode" : "Dark mode";
  themeBtn.setAttribute("aria-pressed", String(isDark));

  try {
    localStorage.setItem("ictTheme", isDark ? "dark" : "light");
  } catch {
    // Theme remains active for the current page.
  }
}

themeBtn.addEventListener("click", () => {
  setTheme(!document.body.classList.contains("dark"));
});

document.getElementById("homeBtn").addEventListener("click", () => {
  searchBox.value = "";
  showHome();
});

/* ================= INIT ================= */
try {
  setTheme(localStorage.getItem("ictTheme") === "dark");
} catch {
  setTheme(false);
}

applyFont();
showHome();
</script>

</html>
